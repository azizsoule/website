baseURL: "https://www.azizsoule.com"
languageCode: "en"
theme: PaperMod
title: Aziz Soulé

# Enable emoji shortcodes. Ex: :smile:
enableEmoji: true

# Languages configuration
languages:
  en:
    languageCode: "en"
    languageName: "🏴󠁧󠁢󠁥󠁮󠁧󠁿"
    weight: 1
    menu:
      main:
        - identifier: about
          url: /
          name: 🤹🏾‍♂️ About Me
          weight: 1
        - identifier: blog
          url: /blog
          name: 📝 Blog
          weight: 2
        - identifier: projects
          url: /projects
          name: 🚀 Projects
          weight: 3
        - identifier: search
          url: /search
          name: 🔍 Search
          weight: 4

  fr:
    languageCode: "fr"
    languageName: "🇫🇷"
    weight: 2
    menu:
      main:
        - identifier: about
          url: /
          name: 🤹🏾‍♂️ À propos de moi
          weight: 1
        - identifier: blog
          url: /blog
          name: 📝 Blog
          weight: 2
        - identifier: projects
          url: /projects
          name: 🚀 Projets
          weight: 3
        - identifier: search
          url: /search
          name: 🔍 Rechercher
          weight: 4

params:
  # Environment
  env: production

  # Light or dark theme : light, dark, auto (auto for system preference)
  defaultTheme: auto

  # Allow to display images in full size
  cover:
    linkFullImages: true

  # For open graph cover image
  images: [ "images/me-yellow.png.jpeg" ]

  # To display the breadcrumb (Ex: home > section > page)
  showBreadCrumbs: true

  # For home page with only text
  homeInfoParams:
    enabled: false
    Title: Hi there wave
    Content: Can be Info, links, about...

  # For profile home page with image
  profileMode:
    enabled: false
    title: "Aziz Soulé"
    imageUrl: "/images/me.jpeg"
    imageTitle: "Aziz Soulé - Picture credit: Aniéla Carly"
    buttons:
      - name: Resume
        url: "/resume.pdf"
      - name: Github
        url: "/contact"

  # For social networks
  socialIcons:
    - name: linkedin
      url: https://www.linkedin.com/in/azizsoule
    - name: github
      url: https://www.github.com/azizsoule

  # For search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    # limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: [ "title", "permalink", "summary", "content", "tags", "description" ]

# Search engine
outputs:
  home:
    - HTML
    - RSS
    - JSON
  page:
    - HTML
    - RSS
    - JSON
  rss":
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS
    - JSON
  taxonomy:
    - HTML
    - RSS
    - JSON
  term:
    - HTML
    - RSS
    - JSON